{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                    <i class="bi bi-lock-fill"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">Sign In</h2>
                <p class="text-muted small">Enter your credentials to access your portal</p>
            </div>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger py-2 small rounded-3 mb-3 text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Invalid username or password.
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 py-2 shadow-none" required placeholder="Enter username">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 py-2 shadow-none" required placeholder="Enter password">
                    </div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary py-2.5 rounded-pill fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login to Portal
                    </button>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted small mb-0">Want to join the ecosystem? <a href="{% url 'accounts:register' %}" class="text-primary fw-bold text-decoration-none">Register a Business</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
